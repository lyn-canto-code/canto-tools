function sceneSvg(n){let d=['<rect x="25" y="42" width="150" height="72" rx="10"/><rect x="39" y="60" width="64" height="40" rx="4"/><path d="M116 89h43M116 77h43M116 65h43"/>','<circle cx="100" cy="64" r="37"/><path d="M100 18v-8M100 118v-8M56 64H44M156 64h-12M68 32l-8-8M132 96l8 8M132 32l8-8M68 96l-8 8"/>','<path d="M35 34h130v75H35zM49 50h102v9H49zM49 72h102v8H49zM49 93h102v9H49z"/><path d="M56 29l-11-12M110 34l10-14M160 42l11-11"/>','<path d="M60 109v-30h80v30M48 79V53l52-33 52 33v26M85 52v27M113 52v27"/><path d="M20 42l-12-7M20 69l-12 3M180 43l12-7M180 70l12 3"/>','<path d="M32 110V38h136v72M32 67h136M68 38v72M132 38v72"/><path d="M32 67h136M47 82h32M120 82h32"/>','<path d="M33 108V55l68-34 67 34v53H33zM51 66h48v29H51zM114 65h36v43h-36z"/><path d="M38 45l64-31 63 31"/>'][n];return `<svg viewBox="0 0 200 135" aria-label="Illustration ${n+1}"><g class="scene-icon">${d}</g></svg>`}
function teacher(s){return state.notes?`<div class="teacher"><strong>Teacher Notes — hide before screen sharing</strong><div>${s}</div></div>`:''}
function matchHtml(page){const words=page===0?words1:page===1?words2:rentWords;state.matchPage=page;const key='p'+page;const done=state.matched[key]||(state.matched[key]=[]);return `<div class="row-between" style="margin-bottom:13px"><span class="pill">${done.length} / 6 matched</span><div class="row"><button class="btn" onclick="resetMatch()">↻ Retry</button><span class="mini">Tap picture → word</span></div></div><div class="two"><section class="section"><h3>① Pictures</h3><div class="vocab-left">${(picOrders[page]||[2,0,4,1,5,3]).map((i,n)=>`<button class="picture-tile ${done.includes(i)?'done':state.pic===i?'selected':''}" onclick="choosePic(${i})"><span class="number">${String(n+1).padStart(2,'0')}</span><img class="v9-match-photo" src="${imgAssets[matchingImages[page===0?'housing0':page===1?'housing1':'housing0'][i]]}" alt="Housing visual clue"/><span class="mini">${done.includes(i)?'✓ Matched':'Tap to select'}</span></button>`).join('')}</div></section><section class="section"><h3>② Word Choices</h3><div class="vocab-right">${(wordOrders[page]||[1,4,2,5,0,3]).map(i=>`<button class="word-tile ${done.includes(i)?'done':state.word===i?'selected':''}" onclick="chooseWord(${i})">${v(...words[i])}</button>`).join('')}</div></section></div><div class="bottom-prompt"><strong>Speaking Follow-up</strong><div class="prompt-zh">${page===0?txt('你屋企闊唔闊落？間屋光唔光猛？','nei5 uk1 kei2 fut3 m4 fut3 lok6? gaan1 uk1 gwong1 m4 gwong1 maang5?','Is your home spacious? Is it bright?'):txt('你間屋有冇露台？屋企有咩傢俬？','nei5 gaan1 uk1 jau5 mou5 lou6 toi4? uk1 kei2 jau5 me1 gaa1 si1?','Does your apartment have a balcony? What furniture do you have?')}</div><p id="feedback" class="${done.length===6?'success':'muted'}">${done.length===6?'✓ All matched! Now describe a home using three words.':'Select a picture and matching word.'}</p></div>${teacher('配對後立即追問，讓學生用完整句子描述；此原型圖片係示意插畫，正式圖片會進一步製作。')}`}
function choosePic(i){let d=state.matched['p'+state.matchPage]||[];if(d.includes(i))return;state.pic=i;checkMatch()}
function chooseWord(i){const wd=state.matchPage===0?words1:state.matchPage===1?words2:rentWords;speak(wd[i][0]);let d=state.matched['p'+state.matchPage]||[];if(d.includes(i))return;state.word=i;checkMatch()}

function agentRoleHtml(){return `<div class="v8-role-header"><div><strong>ROLE-PLAY 2 · STUDENT = ESTATE AGENT</strong><div class="mini">Goal: discover the customer’s needs, compare D/E/F, recommend the best fit and handle objections</div></div><span class="pill">19 min</span></div><div class="role-v7 v8-role-grid"><section class="section"><h3>Your Mission · Estate Agent</h3><div class="role-banner">${txt('你係地產代理，手上有 D、E、F 三間屋。老師扮租客，佢嘅要求你仲未知。你要主動問問題，再推介一間合適嘅屋。','nei5 hai6 dei6 caan2 doi6 lei5, sau2 soeng6 jau5 D, E, F saam1 gaan1 uk1. lou5 si1 baan6 zou1 haak3, keoi5 ge3 jiu1 kau4 nei5 zung6 mei6 zi1. nei5 jiu3 zyu2 dung6 man6 man6 tai4, zoi3 teoi1 gaai3 jat1 gaan1 hap6 sik1 ge3 uk1.','You are the agent. Ask the customer about their needs before recommending D, E or F.')}</div>${roleHomesStrip(agentHomes)}${roleSupport(agentQuestions)}<details class="support-details"><summary>Useful Recommendation Patterns</summary>${agentPatterns.map(x=>`<div class="mini-pattern">${patternText(x)}</div>`).join('')}</details><div class="v8-goals">✓ Ask ≥4 needs questions &nbsp; ✓ Compare ≥2 apartments &nbsp; ✓ Recommend + justify &nbsp; ✓ Respond to an objection</div>${teacherPanel(`<table class="enquiry-table v8-teacher-table"><thead><tr><th>Customer need</th><th>Teacher · Tenant</th></tr></thead><tbody>${customerNeeds.map(c=>`<tr><td>${txt(...c.slice(0,3))}</td><td>${txt(...c.slice(3))}</td></tr>`).join('')}</tbody></table><p class="mini">Only give answers when the student asks. After recommendation, say you prefer a short MTR walk and ask what compromise is possible.</p>`)}</section><section class="section"><h3>Estate Agent · D / E / F Property Data</h3>${roleTable(agentHomes,'display')}<div class="v8-last-step"><h3>Customer Needs · Your Notes</h3><div class="v8-note-grid">${customerNeeds.map((c,i)=>`<label><span>${txt(...c.slice(0,3))}</span><input class="enquiry-input" placeholder="Ask the customer…" aria-label="Customer need ${c[2]}" value="${esc(state.notesText['customer-'+i]||'')}" oninput="setNote('customer-${i}',this.value)"></label>`).join('')}</div><h3 style="margin-top:10px">Your Recommendation</h3>${noteArea('agent-recommend','Which apartment? Give two reasons and one trade-off…')}</div></section></div>${teacher('19 分鐘：2 分鐘了解 D/E/F，7 分鐘學生向老師問需求，6 分鐘比較並推介，4 分鐘由老師提出反對意見、學生回應。老師需要先收埋顧客要求，只按學生問題作答。DEF 與 ABC 係完全不同嘅樓盤。')}`}

function finalDecisionV7(){return `<div class="final-v7"><section class="section"><div class="row-between"><h3>New Information · Teacher Announces</h3><button class="btn" onclick="state.reveal=!state.reveal;render()">${state.reveal?'Hide':'Reveal'} New Information</button></div><div class="role-banner">${txt('我啱啱收到多啲資料，你仲會唔會揀同一間屋？','ngo5 ngaam1 ngaam1 sau1 dou3 do1 di1 zi1 liu2, nei5 zung6 wui5 m4 wui5 gaan2 tung4 jat1 gaan1 uk1?','I have just received new information. Would you keep your choice?')}</div>${state.reveal?`<div class="reveal-context">${apartments.map(a=>`<div class="mini-pattern"><b>Apartment ${a.id}</b> · ${txt(...a.hidden)}</div>`).join('')}</div>`:'<p class="mini">Teacher: reveal this only after the student has made an initial choice.</p>'}<h3 style="margin-top:12px">Final Decision · Explain Your Choice</h3>${txt('我最後會揀＿＿，因為＿＿。雖然＿＿，但係＿＿。','ngo5 zeoi3 hau6 wui5 gaan2 ..., jan1 wai6 ... . seoi1 jin4 ..., daan6 hai6 ... .','I would finally choose ... because ... . Although ... , ... .')}<div class="criteria">Speak 45–60 sec · Two reasons · One trade-off · Respond to new information</div>${noteArea('final-choice','My final choice and reasons…')}</section><section class="section"><h3>Apartment Reference · A / B / C</h3><div class="role-photos v7-final-photos">${apartments.map(a=>`<div>${aptArt(a)}<b>Apartment ${a.id}</b><div class="mini">HK$${a.cost.toLocaleString()} · ${a.area} ${txt('呎','cek3','sq ft')} · ${a.mins} ${txt('分鐘','fan1 zung1','min')}</div></div>`).join('')}</div><button class="btn" style="margin-top:10px" onclick="state.showCollected=!state.showCollected;render()">${state.showCollected?'Hide':'Review'} Phone Enquiry Notes</button>${state.showCollected?`<div class="collected-grid">${apartments.map(a=>`<div><strong>Apartment ${a.id}</strong>${enquiryFields.map((f,i)=>`<div><span>${esc(f[0])}</span><span>${esc(state.notesText['enquiry-'+a.id+'-'+i]||'—')}</span></div>`).join('')}</div>`).join('')}</div>`:''}</section></div>${teacher('10 分鐘：2 分鐘老師宣布新資料；3 分鐘讓學生調整選擇、追問；最後 5 分鐘解釋最後決定及回饋。學生可以認為三間都不適合。')}`}
function roleHtml(n){const first=n===1;return `<div class="builder-layout"><section class="section"><h3>${first?'Student · Tenant':'Student · Estate Agent'}</h3><div class="role-banner">${first?txt('你嘅預算係每個月一萬二千蚊。你想住近地鐵站，而且要可以養貓。','nei5 ge3 jyu6 syun3 hai6 mui5 go3 jyut6 jat1 maan6 ji6 cin1 man1. nei5 soeng2 zyu6 kan5 dei6 tit3 zaam6, ji4 ce2 jiu3 ho2 ji5 joeng5 maau1.','Your budget is HK$12,000/month. You want to live near the MTR and keep a cat.'):txt('你係地產代理。介紹最少兩間屋，並解釋你點解推薦其中一間。','nei5 hai6 dei6 caan2 doi6 lei5. gaai3 siu6 zeoi3 siu2 loeng5 gaan1 uk1, bing6 gaai2 sik1 nei5 dim2 gaai2 teoi1 zin3 kei4 zung1 jat1 gaan1.','You are the agent. Compare at least two apartments and recommend one.')}</div><div class="prompt-stack">${(first?[['呢間屋每個月租金幾多？','ni1 gaan1 uk1 mui5 go3 jyut6 zou1 gam1 gei2 do1?','How much is the rent?'],['可唔可以養寵物？','ho2 m4 ho2 ji5 joeng5 cung2 mat6?','Are pets allowed?'],['要畀幾多按金？','jiu3 bei2 gei2 do1 on3 gam1?','How much is the deposit?']]:[['如果你想平啲，我會建議你睇 B。','jyu4 gwo2 nei5 soeng2 peng4 di1, ngo5 wui5 gin3 ji5 nei5 tai2 B.','If you want something cheaper, I recommend B.'],['A 雖然細啲，但係近地鐵站。','A seoi1 jin4 sai3 di1, daan6 hai6 kan5 dei6 tit3 zaam6.','A is smaller but closer to the MTR.']]).map(x=>`<div class="prompt-card">${txt(...x)}</div>`).join('')}</div></section><section class="section"><div class="row-between"><h3>${first?'Teacher · Agent':'Teacher · Tenant'}</h3><button class="btn" onclick="state.roleReveal=!state.roleReveal;render()">${state.roleReveal?'Hide':'Reveal'} Role Card</button></div><div class="teacher-slate ${state.roleReveal?'':'concealed'}">${state.roleReveal?(first?apartments.map(a=>`<div class="prompt-card"><b>Apartment ${a.id}</b> · HK$${a.cost.toLocaleString()} · ${txt(...a.hidden)}</div>`).join(''):txt('你想要租金平、間屋闊落、交通又方便，但係預算有限。','nei5 soeng2 jiu3 zou1 gam1 peng4, gaan1 uk1 fut3 lok6, gaau1 tung1 jau6 fong1 bin6, daan6 hai6 jyu6 syun3 jau5 haan6.','You want a cheap, spacious apartment with good transport, but your budget is limited.')):'🔒 Teacher-only role details hidden.'}</div><div class="criteria">${first?'Ask ≥4 questions · Respond to new conditions':'Compare ≥2 homes · Recommend + justify'}</div></section></div>${teacher(first?'7 分鐘：學生做租客，主動問至少四題；老師按需要追加隱藏條件。':'7 分鐘：老師扮難應付嘅租客；學生要主動介紹、比較、提出建議。')}`}
function lastHtml(){return `<div class="focus-task"><span class="badge-big">FINAL SPEAKING · 60 SEC</span><div class="zh">${txt('我最後會揀邊間屋？','ngo5 zeoi3 hau6 wui5 gaan2 bin1 gaan1 uk1?','Which apartment would I choose?')}</div><div class="prompt-card">${txt('我最後會揀＿＿，因為＿＿。另外＿＿。雖然＿＿，但係＿＿。對我嚟講，最緊要係＿＿。','ngo5 zeoi3 hau6 wui5 gaan2 ..., jan1 wai6 ... . ling6 ngoi6 ... . seoi1 jin4 ..., daan6 hai6 ... . deoi3 ngo5 lai4 gong2, zeoi3 gan2 jiu3 hai6 ... .','I would finally choose ... because ... . Also ... . Although ... , ... . What matters most to me is ... .')}</div></div><section class="section"><h3>Speaking Assessment</h3><div class="check-grid">${['Describe apartment conditions','Compare advantages and disadvantages','Respond to new information','Give two reasons + one trade-off'].map(x=>`<label class="check-row"><input type="checkbox"> ${x}</label>`).join('')}</div></section>${teacher('4 分鐘。學生用45–60秒總結，老師按四項準則作即時回饋。')}`}
function rentMatchHtml(){const done=state.matched['rent']||(state.matched['rent']=[]);const left=rentWords.map((w,i)=>({w,i}));const right=[3,0,5,1,4,2];return `<div class="row-between"><strong>${done.length} / 6 matched</strong><button class="btn" onclick="state.matched.rent=[];state.rentLeft=null;render()">↻ Retry</button></div><div class="rent-match"><div>${left.filter(x=>!done.includes(x.i)).map(x=>`<button class="choice ${state.rentLeft===x.i?'selected':''}" onclick="state.rentLeft=${x.i};speak('${x.w[0]}');render()">${v(...x.w)}</button>`).join('')}</div><div>${right.filter(i=>!done.includes(i)).map(i=>`<button class="choice" onclick="if(state.rentLeft===${i}){state.matched.rent.push(${i});state.rentLeft=null;}else{state.rentLeft=null;}render()">${esc(rentWords[i][2])}</button>`).join('')}</div></div>${done.length===6?'<div class="success">✓ All matched!</div>':''}${teacher('Lesson 2 生字配對；英文字作為右側答案選項，即使 English OFF 亦顯示，因為配對活動本身需要英文意思。')}`}
const views=[
{l:1,group:'Warm-up',name:'Warm-up',title:'Your Living Environment',sub:'Talk about your own home',minutes:'5 min',render:warmupHtml},
{l:1,group:'Vocabulary',name:'Matching 1',title:'Vocabulary · Picture Matching 1',sub:'Describe the living environment',minutes:'4 min',render:()=>matchHtml(0)},
{l:1,group:'Vocabulary',name:'Matching 2',title:'Vocabulary · Picture Matching 2',sub:'Facilities and floor area',minutes:'3 min',render:()=>matchHtml(1)},
{l:1,group:'Vocabulary',name:'Flip Cards',title:'Vocabulary · Flip Cards',sub:'Flip and speak',minutes:'3 min',render:()=>vocabFlip('housing')},
{l:1,group:'Compare & Discuss',name:'Compare & Discuss',title:'Compare & Discuss',sub:'Use sentence patterns to compare the homes',minutes:'17 min',render:compareDiscussHtml},
{l:1,group:'YouTube Listening',name:'YouTube Listening',title:'YouTube Listening & Discussion',sub:'Watch the tour and discuss this apartment',minutes:'18 min',render:videoTaskHtml},
{l:2,group:'Scenario',name:'Scenario',title:'You Are Moving!',sub:'A new renting mission',minutes:'5 min',render:scenarioHtml},
{l:2,group:'Vocabulary',name:'Matching',title:'Renting Vocabulary · Matching',sub:'Learn essential renting terms',minutes:'4 min',render:rentMatchHtml},
{l:2,group:'Vocabulary',name:'Flip Cards',title:'Renting Vocabulary · Flip Cards',sub:'Practice words and questions',minutes:'4 min',render:()=>vocabFlip('renting')},
{l:2,group:'Role-play 1',name:'Role-play 1',title:'Role-play 1 · Student Is the Tenant',sub:'Ask about A/B/C and record information',minutes:'18 min',render:roleTaskHtml},
{l:2,group:'Role-play 2',name:'Role-play 2',title:'Role-play 2 · Student Is the Agent',sub:'Ask the customer, compare D/E/F and recommend',minutes:'19 min',render:agentRoleHtml}
];

function sectionNav(){let l=views[state.screen].l;const list=views.map((x,i)=>({...x,i})).filter(x=>x.l===l);const groups=[...new Set(list.map(x=>x.group))];return groups.map(g=>{const matches=list.filter(x=>x.group===g);const active=matches.some(x=>x.i===state.screen);return matches.length===1?`<button class="chapter-tab ${active?'current':''}" onclick="goto(${matches[0].i})">${esc(g)}</button>`:`<div class="nav-dropdown ${active?'active-group':''}"><button class="chapter-tab ${active?'current':''}" onclick="toggleGroup('${g}')" aria-haspopup="true" aria-expanded="false">${esc(g)} ▾</button><div class="nav-menu">${matches.map(x=>`<button class="chapter-tab ${x.i===state.screen?'current':''}" onclick="goto(${x.i})">${esc(x.name)}</button>`).join('')}</div></div>`}).join('')}
function toggleGroup(g){let menu=[...document.querySelectorAll('.nav-dropdown')].find(el=>el.querySelector('button')?.textContent?.includes(g));if(menu)menu.classList.toggle('menu-open')}
function render(){const x=views[state.screen];document.getElementById('lessonName').textContent=`LESSON ${x.l} · ${x.group.toUpperCase()}`;document.getElementById('screenTitle').textContent=x.title;document.getElementById('subtitle').textContent=x.sub+' · '+x.minutes;document.getElementById('content').innerHTML=x.render();document.getElementById('chapterTabs').innerHTML=sectionNav();document.getElementById('navCount').textContent=`${views.filter(z=>z.l===x.l).findIndex(z=>z===x)+1} / ${views.filter(z=>z.l===x.l).length}`;for(let n of [1,2])document.getElementById('lesson'+n).classList.toggle('current',x.l===n);for(let k of ['jp','en','notes']){const b=document.getElementById(k==='jp'?'jpBtn':k==='en'?'enBtn':'notesBtn');b.classList.toggle('on',state[k]);b.textContent=k==='jp'?`Jyutping ${state[k]?'ON':'OFF'}`:k==='en'?`English ${state[k]?'ON':'OFF'}`:`Teacher Notes ${state[k]?'ON':'OFF'}`}}
function toggle(k){state[k]=!state[k];render()}
function goto(i){state.screen=Math.max(0,Math.min(views.length-1,i));state.pic=null;state.word=null;state.roleReveal=false;render();window.scrollTo({top:0,behavior:'instant'})}
function go(d){goto((state.screen+d+views.length)%views.length)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.menu-open').forEach(el=>el.classList.remove('menu-open'))});
render();
</script></body></html>

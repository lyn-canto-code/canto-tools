<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 · Safari 大冒險</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2d2a26;--muted:#7a7066;--line:#e8dfd2;--acc:#d9822b;--acc2:#4f8a5b;--accbg:#fdf0e1;--ok:#3d8b4f;--okbg:#e7f4ea;--bad:#c0473b;--badbg:#fbe9e7;--tn:#5b5fc7;--tnbg:#eef0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif}
button{font:inherit;cursor:pointer}
header{background:#3b3226;color:#fff;padding:14px 16px}
header .k{font-size:12px;letter-spacing:.12em;opacity:.7}
header h1{margin:2px 0 0;font-size:24px}
header .jp,header .en{opacity:.8}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tog{border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:99px;padding:4px 12px;font-size:14px}
.tog.on{background:#fff;color:#3b3226}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;color:var(--muted)}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:6px 0 4px;font-size:22px}
h3{margin:18px 0 8px;font-size:18px}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.jp{display:block;color:var(--acc);font-size:.82em;letter-spacing:.01em}
.en{display:block;color:var(--muted);font-size:.85em}
.inl .jp,.inl .en{display:inline;margin-left:6px}
body.nojp .jp,body.noen .en{display:none!important}
.teacher{display:none;background:var(--tnbg);border-left:4px solid var(--tn);border-radius:8px;padding:10px 12px;margin:10px 0;color:#2d2f6b;font-size:14px}
.teacher b{color:var(--tn)}
.teacher ul{margin:4px 0 0;padding-left:18px}
body.tn .teacher{display:block}
.say{cursor:pointer;border-bottom:1px dashed transparent}
.say:hover{border-bottom-color:var(--acc)}
.spk{border:0;background:var(--accbg);color:var(--acc);border-radius:99px;width:30px;height:30px;font-size:15px;flex:none}
.row{display:flex;gap:10px;align-items:flex-start}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:4px 10px;font-size:14px}
.pagenav{display:flex;justify-content:space-between;margin:24px 0 40px}
.crop{width:100%;aspect-ratio:4/3;border-radius:10px;background-repeat:no-repeat;background-color:#eee}
/* scene */
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stage{position:relative;border-radius:12px;overflow:hidden;line-height:0}
.stage img{width:100%;display:block}
.hs{position:absolute;border:2px solid #ffffffcc;border-radius:8px;background:#ffffff10;box-shadow:0 0 0 1px #0003;cursor:pointer;line-height:1.3}
.hs:hover,.hs.on{background:#ffffff35;border-color:#fff}
.hs.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}
.hs .lab{display:none;position:absolute;left:50%;top:100%;transform:translate(-50%,4px);background:#000a;color:#fff;font-size:13px;padding:1px 7px;border-radius:6px;white-space:nowrap}
.stage.labels .hs .lab{display:block}
.stage.nobox .hs:not(.on){border-color:transparent;box-shadow:none;background:transparent}
.story{display:flex;gap:10px;align-items:flex-start;background:var(--accbg);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:18px}
.info{min-height:90px}
.info .w{font-size:28px;font-weight:600}
.info .ex{margin-top:8px;font-size:18px}
/* flashcards */
.fc{perspective:900px;cursor:pointer}
.fc .in{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:100%}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.fc .b{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;gap:6px;background:var(--accbg)}
.fc .zh{font-size:24px;font-weight:600;margin-top:6px}
.fc .b .big{font-size:20px;font-weight:600}
.fc .b .ex{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.chip .zh{font-size:22px;font-weight:600}
/* matching */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mitem{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px;text-align:center;margin-bottom:8px;width:100%}
.mitem.sel{border-color:var(--acc);background:var(--accbg)}
.mitem.done{border-color:var(--ok);background:var(--okbg);opacity:.75;cursor:default}
.mitem.bad{animation:shake .35s;border-color:var(--bad)}
.mpics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.mpics .mitem{padding:4px;margin:0}
.mwords .mitem{font-size:20px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.score{font-weight:600;color:var(--ok)}
/* patterns */
.pat{border-left:5px solid var(--acc2)}
.pat .t{font-size:22px;font-weight:600}
.qa{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;margin:10px 0;font-size:18px}
.qa .lbl{font-size:13px;color:#fff;background:var(--acc2);border-radius:6px;padding:1px 7px;margin-top:3px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center;font-size:22px}
.slot{min-width:70px;min-height:52px;border:2px dashed #c9bba8;border-radius:10px;padding:4px 10px;text-align:center;background:#fff}
.slot.fix{border-style:solid;border-color:var(--line);background:#f6f1ea}
.slot.fill{border-style:solid;border-color:var(--acc2);background:#eef6ef;cursor:pointer}
.slot .jp{font-size:13px}
.slot .hint{font-size:13px;color:var(--muted)}
.bank h4{margin:10px 0 6px;font-size:14px;color:var(--muted)}
.tile{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;margin:0 6px 6px 0;font-size:18px}
.tile .jp{font-size:12px}
.tile:hover{border-color:var(--acc2)}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.mwq{display:grid;grid-template-columns:minmax(160px,260px) 1fr;gap:14px;align-items:center}
.mwq .opts{display:flex;flex-wrap:wrap;gap:8px}
.mwq .opts button{font-size:22px;min-width:60px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:#fff}
.mwq .opts button.ok{border-color:var(--ok);background:var(--okbg)}
.mwq .opts button.no{border-color:var(--bad);background:var(--badbg)}
/* mission */
.guess .g{border:2px solid var(--line);border-radius:12px;padding:4px;background:#fff;text-align:center}
.guess .g.on{border-color:var(--acc);background:var(--accbg)}
.guess .g .nm{visibility:hidden;font-weight:600;font-size:18px}
.guess .g.on .nm,.guess.show .g .nm{visibility:visible}
.frames li{margin-bottom:8px;font-size:18px}
.frames{padding-left:0;list-style:none}
.frames label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.frames input{width:20px;height:20px;margin-top:4px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.thumbs img{height:64px;border-radius:8px;border:3px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--acc)}
.riddle{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.ans{color:var(--tn);font-weight:600}
/* saved */
.saved li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:18px}
.saved ol{padding:0;margin:0;list-style:none}
.saved .x{margin-left:auto}
.empty{color:var(--muted)}
.vtab{width:100%;border-collapse:collapse;font-size:15px}
.vtab td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.vtab td:first-child{font-size:18px;font-weight:600;white-space:nowrap}
@media (max-width:640px){.mcols{grid-template-columns:1fr}.mwq{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:20px}}
/* flipcards (personality style) */
.flipcard{position:relative;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.flipcard.is-en{background:var(--accbg)}
.flipcard .crop{margin-bottom:4px}
.fzh{font-size:30px;font-weight:600}
.fen{font-size:20px;font-weight:600}
.corner{position:absolute;right:8px;top:6px;color:var(--muted);font-size:14px}
/* measure words */
.mwrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.mwchip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;gap:10px;align-items:center}
.mwz{font-size:30px;font-weight:600;text-align:center;min-width:48px}
.mwz .jp{font-size:13px}
.mwpics{display:flex;flex-wrap:wrap;gap:4px}
.mwpics>div{width:54px}
/* pattern picture */
.pbuild{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:14px;align-items:start;margin-top:10px}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:14px}
.ntile{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px}
.tpic{width:46px;flex:none}
.tpic .crop{border-radius:6px}
@media (max-width:640px){.pbuild{grid-template-columns:1fr}}
</style>
</head>

const IMG = [], DIM = [];
const V = {}; [...L.vocab, ...L.extra].forEach(v => V[v.id] = v);
const st = {page: 0, scene: 0, item: null, labels: false, flipAll: false, flipped: {}, match: {}, build: {}, mwq: null, ppic: {}, guess: null, guessShow: false, mscene: 0};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function T(o, cls = '') {
  return `<span class="${cls}"><span class="say zh" data-say="${esc(o.zh)}">${esc(o.zh)}</span>` +
    (o.jp ? `<span class="jp">${esc(o.jp)}</span>` : '') + (o.en ? `<span class="en">${esc(o.en)}</span>` : '') + `</span>`;
}
const spk = t => `<button class="spk" data-say="${esc(t)}" title="Listen">🔊</button>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- speech ----------
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /zh[-_]HK/i.test(v.lang)) || vs.find(v => /yue/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) {
  if (!('speechSynthesis' in window)) return;
  t = t.replace(/[＿_]+/g, '，');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'zh-HK'; if (voice) u.voice = voice; u.rate = .85;
  speechSynthesis.speak(u);
}

// ---------- images ----------
function toBlobUrl(d) {
  const [h, b] = d.split(','); const bin = atob(b); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([a], {type: h.slice(5).split(';')[0]}));
}
function crop(v) {
  const s = v.scene, b = v.box, W = DIM[s][0], H = DIM[s][1];
  let cw = Math.min(100, b.w * 1.25) * W / 100, ch = Math.min(100, b.h * 1.25) * H / 100;
  if (cw / ch > 4 / 3) ch = cw * 3 / 4; else cw = ch * 4 / 3;
  if (cw > W) { cw = W; ch = W * 3 / 4; } if (ch > H) { ch = H; cw = H * 4 / 3; }
  const w = cw / W * 100, h = ch / H * 100;
  const l = Math.max(0, Math.min(100 - w, b.x - w / 2)), t = Math.max(0, Math.min(100 - h, b.y - h / 2));
  const px = w >= 99.9 ? 50 : l / (100 - w) * 100, py = h >= 99.9 ? 50 : t / (100 - h) * 100;
  return `<div class="crop" style="background-image:url(${IMG[s]});background-size:${10000 / w}% ${10000 / h}%;background-position:${px}% ${py}%"></div>`;
}

function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

  ${L.warmup.map((q, i) => `<div class="card"><div class="qa"><span class="lbl">Q</span><div class="row">${spk(q.zh)}${T(q)}</div>
    <span class="lbl">A</span><div class="row">${spk(L.warmupAns[i].zh)}${T(L.warmupAns[i])}</div></div></div>`).join('')}
  <div class="teacher"><b>Teacher Notes</b><ul><li>用英文都得，目標係引起興趣；記低學生鍾意嘅動物，之後句式部分用返。</li>
  <li>介紹「動物 dung6 mat6」同「動物園 dung6 mat6 jyun4」。今日嘅任務：最後要用相講 3 句。</li></ul></div>`;
}

function scene() {
  const s = L.scenes[st.scene];
  const it = st.item && V[st.item];
  return `<h2>Story</h2>
  <div class="stabs">${L.scenes.map((_, i) => `<button class="btn sm ${i === st.scene ? 'pri' : ''}" data-act="scene" data-i="${i}">${i + 1}</button>`).join('')}
    <button class="btn sm ${st.labels ? 'pri' : ''}" data-act="labels" style="margin-left:auto">Labels</button></div>
  <div class="story">${spk(s.story.zh)}${T(s.story)}</div>
  <div class="stage ${st.labels ? 'labels' : ''}">
    <img src="${IMG[st.scene]}" alt="">
    ${s.items.map(id => { const v = V[id], b = v.box;
      return `<div class="hs ${st.item === id ? 'on' : ''}" data-act="hs" data-id="${id}" style="left:${b.x - b.w / 2}%;top:${b.y - b.h / 2}%;width:${b.w}%;height:${b.h}%"><span class="lab">${esc(v.zh)}</span></div>`; }).join('')}
  </div>
  ${it ? `<div class="card info"><div class="row">${spk(it.zh)}<div><span class="w">${T({zh: it.zh, jp: it.jp, en: it.en})}</span></div></div>
    <div class="row ex">${spk(it.ex.zh)}${T(it.ex)}</div></div>` : ''}
  <div class="teacher"><b>Teacher Notes · 圖 ${st.scene + 1}</b><ul>${s.teacher.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="pagenav" style="margin-top:12px"><button class="btn" data-act="scene" data-i="${Math.max(0, st.scene - 1)}" ${st.scene ? '' : 'disabled'}>‹</button>
    <button class="btn pri" data-act="scene" data-i="${Math.min(L.scenes.length - 1, st.scene + 1)}" ${st.scene < L.scenes.length - 1 ? '' : 'disabled'}>›</button></div>`;
}

// personality-style cards: Cantonese side (中文＋粵拼) / English side (picture if any + English)
function flipcard(id, zh, jp, en, pic) {
  const english = st.flipped[id] ?? st.flipAll;
  return `<button class="flipcard ${english ? 'is-en' : ''}" data-act="flip" data-id="${id}" data-zh="${esc(zh)}">
    ${english ? `${pic || ''}<span class="fen">${esc(en)}</span>` : `<span class="fzh">${esc(zh)}</span><span class="jp fjp">${esc(jp)}</span>`}
    <span class="corner">↻</span></button>`;
}
function cards() {
  return `<h2>Flashcards</h2>
  <button class="btn" data-act="flipall">↻ Flip all to ${st.flipAll ? 'Cantonese' : 'English'}</button>
  <h3>Nouns</h3>
  <div class="grid">${L.vocab.map(v => flipcard(v.id, v.zh, v.jp, v.en, crop(v))).join('')}</div>
  <h3>Adjectives</h3>
  <div class="grid">${L.adj.map((a, i) => flipcard('a' + i, a.zh, a.jp, a.en)).join('')}</div>
  <div class="teacher"><b>Teacher Notes</b><ul><li>先睇中文面讀出嚟，再用「Flip all」轉做英文＋圖，叫學生講返中文。</li><li>形容詞用「好」：好大、好高。</li></ul></div>`;
}

function matchGame(key, left, right, leftHtml, rightHtml, cls) {
  const m = st.match[key] || (st.match[key] = {l: shuffle(left.map((_, i) => i)), r: shuffle(right.map((_, i) => i)), sel: null, done: [], bad: null});
  return `<div class="mcols"><div class="${cls}">${m.l.map(i => `<button class="mitem ${m.done.includes(i) ? 'done' : ''} ${m.sel === i ? 'sel' : ''}" data-act="ml" data-k="${key}" data-i="${i}">${leftHtml(left[i])}</button>`).join('')}</div>
    <div class="mwords">${m.r.map(i => `<button class="mitem ${m.done.includes(i) ? 'done' : ''} ${m.bad === i ? 'bad' : ''}" data-act="mr" data-k="${key}" data-i="${i}">${rightHtml(right[i])}</button>`).join('')}</div></div>
    <p>${m.done.length === left.length ? `<span class="score">✓ ${left.length} / ${left.length}</span>` : `${m.done.length} / ${left.length}`} <button class="btn sm" data-act="mreset" data-k="${key}">↻</button></p>`;
}
function matching() {
  const g1 = L.vocab.slice(0, 6), g2 = L.vocab.slice(6);
  const pic = v => crop(v), word = v => `<span class="zh">${esc(v.zh)}</span><span class="jp">${esc(v.jp)}</span>`;
  return `<h2>Matching</h2>
  <div class="card">${matchGame('p1', g1, g1, pic, word, 'mpics')}</div>
  <div class="card">${matchGame('p2', g2, g2, pic, word, 'mpics')}</div>
  <div class="card">${matchGame('e1', L.vocab, L.vocab, v => esc(v.en), word, '')}</div>
  <div class="teacher"><b>Teacher Notes</b><ul><li>先撳左邊，再撳右邊。學生每配啱一個就讀出嚟。</li></ul></div>`;
}

function measure() {
  if (!st.mwq) st.mwq = {order: shuffle(L.vocab.map(v => v.id)), i: 0, pick: null, right: 0, tries: 0};
  const q = st.mwq;
  const chips = `<div class="mwrow">${L.mw.map(m => { const vs = L.vocab.filter(v => mwOk(v, m[0]));
    return `<div class="mwchip"><div class="say mwz" data-say="一${m[0]}${vs[0].zh}">${m[0]}<span class="jp">${m[1]}</span></div><div class="mwpics">${vs.map(v => `<div title="${esc(v.zh)}">${crop(v)}</div>`).join('')}</div></div>`; }).join('')}</div>`;
  let quiz;
  if (q.i >= q.order.length) quiz = `<p class="score">✓ ${q.right} / ${q.order.length}</p><button class="btn" data-act="mwreset">↻</button>`;
  else {
    const v = V[q.order[q.i]], ok = q.pick && mwOk(v, q.pick);
    quiz = `<div class="mwq"><div>${crop(v)}</div><div><div style="font-size:30px">一 <b style="color:var(--acc)">${q.pick ? esc(q.pick) : '＿'}</b> ${esc(v.zh)}<span class="jp">${esc(v.jp)}</span></div>
      <div class="opts" style="margin:10px 0">${L.mw.map(m => `<button class="${q.pick === m[0] ? (ok ? 'ok' : 'no') : ''}" data-act="mwpick" data-m="${m[0]}">${m[0]}<span class="jp">${m[1]}</span></button>`).join('')}</div>
      ${ok ? `<div class="row">${spk('一' + q.pick + v.zh)}<button class="btn pri" data-act="mwnext" style="margin-left:auto">›</button></div>` : ''}
      <div style="color:var(--muted);font-size:14px">${q.i + 1} / ${q.order.length}</div></div></div>`;
  }
  return `<h2>Measure Words</h2>${chips}<div class="card" style="margin-top:14px">${quiz}</div>
  <div class="teacher"><b>Teacher Notes</b><ul><li>先睇上面：每個量詞配咩嘢，撳量詞聽「一隻雀仔」等。</li><li>A1 唔使背晒，認得「隻、條、個」已經夠。車用「架」或者「部」都得。</li></ul></div>`;
}

// pattern builder
function tilesFor(type, p) {
  if (type === 'noun') return (p.nouns === 'animals' ? L.vocab.filter(v => v.mw[0] === '隻') : L.vocab).map(v => ({zh: v.zh, jp: v.jp, en: v.en, id: v.id}));
  if (type === 'num') return L.nums;
  if (type === 'mw') return L.mw.map(m => ({zh: m[0], jp: m[1]}));
  if (type === 'adj') return L.adj;
  return [];
}
const TYPE_NAME = {noun: 'Noun', num: 'Number', mw: 'Measure word', adj: 'Adjective'};
function slotsOf(p) {
  return p.slots.map(s => s.startsWith('fixed:') ? {type: 'fixed', zh: s.slice(6).split('|')[0], jp: s.split('|')[1]} : {type: s});
}
function builtSentence(p) {
  const b = st.build[p.id] || {}; const sl = slotsOf(p);
  if (sl.some((s, i) => s.type !== 'fixed' && !b[i])) return null;
  const parts = sl.map((s, i) => s.type === 'fixed' ? s : b[i]);
  const zh = parts.map(x => x.zh).join('') + '。', jp = parts.map(x => x.jp).join(' ') + '.';
  const get = t => parts[sl.findIndex(s => s.type === t)];
  let en = '';
  if (p.id === 'p1') en = `This is a ${get('noun').en}.`;
  if (p.id === 'p2') { const n = get('num'); en = `There ${n.en === '1' ? 'is' : 'are'} ${n.en} ${get('noun').en}${n.en === '1' ? '' : '(s)'}.`; }
  if (p.id === 'p3') en = `The ${get('noun').en} is very ${get('adj').en}.`;
  return {zh, jp, en, parts, get};
}
const picOf = p => V[p.pics[(st.ppic[p.id] || 0) % p.pics.length]];
function patternFeedback(p) {
  const s = builtSentence(p); if (!s) return '';
  const want = picOf(p), n = s.get('noun');
  if (n.id !== want.id) return `<div class="fb bad">✗ ${spk(want.zh)} ${esc(want.zh)}</div>`;
  if (p.id === 'p2' && !mwOk(want, s.get('mw').zh)) return `<div class="fb bad">✗ ${esc(mwText(want))}</div>`;
  return `<div class="fb ok">✓</div>`;
}
function patterns() {
  return `<h2>Patterns</h2>
  ${L.patterns.map((p, pi) => { const sl = slotsOf(p), b = st.build[p.id] || {}, s = builtSentence(p), pic = picOf(p), pn = (st.ppic[p.id] || 0) % p.pics.length;
    const types = [...new Set(sl.filter(x => x.type !== 'fixed').map(x => x.type))];
    return `<div class="card pat"><div class="t">${pi + 1}. ${esc(p.title)}<span class="jp">${esc(p.title_jp)}</span><span class="en">${esc(p.title_en)}</span></div>
    <div class="qa"><span class="lbl">Q</span><div class="row">${spk(p.q.zh)}${T(p.q)}</div><span class="lbl">A</span><div class="row">${spk(p.a.zh)}${T(p.a)}</div></div>
    <div class="teacher"><b>重點</b> ${esc(p.note)}</div>
    <div class="pbuild"><div class="ppic">${crop(pic)}<div class="pnav"><button class="btn sm" data-act="ppic" data-p="${p.id}" data-d="-1">‹</button><span>${pn + 1} / ${p.pics.length}</span><button class="btn sm" data-act="ppic" data-p="${p.id}" data-d="1">›</button></div></div>
    <div><div class="slots">${sl.map((x, i) => x.type === 'fixed' ? `<div class="slot fix">${esc(x.zh)}<span class="jp">${esc(x.jp)}</span></div>`
      : b[i] ? `<div class="slot fill" data-act="unslot" data-p="${p.id}" data-i="${i}">${esc(b[i].zh)}<span class="jp">${esc(b[i].jp)}</span></div>`
      : `<div class="slot"><span class="hint">${TYPE_NAME[x.type]}</span></div>`).join('')}<span>。</span></div>
    ${s ? `<div class="row">${spk(s.zh)}${T({zh: s.zh, jp: s.jp, en: s.en})}</div>` : ''}
    ${patternFeedback(p)}
    <p><button class="btn sm pri" data-act="psave" data-p="${p.id}" ${s ? '' : 'disabled'}>＋ My Sentences</button>
       <button class="btn sm" data-act="pclear" data-p="${p.id}">Clear</button></p></div></div>
    <div class="bank">${types.map(t => `<h4>${TYPE_NAME[t]}</h4>${tilesFor(t, p).map((x, k) => `<button class="tile ${t === 'noun' ? 'ntile' : ''}" data-act="tile" data-p="${p.id}" data-t="${t}" data-k="${k}">${t === 'noun' ? `<span class="tpic">${crop(V[x.id])}</span>` : ''}<span>${esc(x.zh)}<span class="jp">${esc(x.jp)}</span></span></button>`).join('')}`).join('')}</div></div>`; }).join('')}
  <div class="teacher"><b>Teacher Notes</b><ul><li>每個句式：老師指住張相問 → 學生撳詞語砌答案 → 讀出嚟 → ＋ My Sentences → 撳 › 換下一張相。</li>
  <li>句式 2 嘅數字由學生數，老師核對；量詞同名詞錯咗會即刻提示。</li><li>句式 3 可以順便教「高唔高？」「大唔大？」問法。</li></ul></div>`;
}

function mission() {
  const g = st.guess;
  return `<h2>Speaking</h2>
  <div class="card"><h3 style="margin-top:0">Listen & guess 👂</h3>
  <div class="grid guess ${st.guessShow ? 'show' : ''}">${L.vocab.map(v => `<div class="g ${g === v.id ? 'on' : ''}" data-act="guess" data-id="${v.id}">${crop(v)}<div class="nm say" data-say="${esc(v.zh)}">${esc(v.zh)}</div></div>`).join('')}</div>
  <p><button class="btn sm ${st.guessShow ? 'pri' : ''}" data-act="guessshow">Names</button></p>
  <div class="teacher"><b>Teacher · 謎語（撳句子讀出）</b>${L.riddles.map(r => `<div class="riddle">${spk(r.s.zh)}<div>${T(r.s)}<span class="ans">→ ${esc(V[r.ans].zh)}</span></div></div>`).join('')}
  <div>學生撳相之後要講：「係<b>長頸鹿</b>！」</div></div></div>
  <div class="card"><h3 style="margin-top:0">Tour guide 🧭</h3>
  <div class="thumbs">${IMG.map((u, i) => `<img src="${u}" class="${i === st.mscene ? 'on' : ''}" data-act="mscene" data-i="${i}" alt="${i + 1}">`).join('')}</div>
  <div class="stage"><img src="${IMG[st.mscene]}" alt=""></div>
  <ul class="frames" style="margin-top:12px">${L.mission.map(f => `<li><label><input type="checkbox">${spk(f.zh)}${T(f)}</label></li>`).join('')}</ul>
  <div class="teacher"><b>Teacher Notes</b><ul>${L.missionTeacher.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></div>`;
}

function review() {
  return `<h2>Review</h2>
  <div class="card saved"><h3 style="margin-top:0">My Sentences (${saved.length})</h3>
  ${saved.length ? `<ol>${saved.map((s, i) => `<li>${spk(s.zh)}<div>${i + 1}. ${T(s)}</div><button class="btn sm x" data-act="del" data-i="${i}">✕</button></li>`).join('')}</ol>` : ''}</div>
  <div class="card"><h3 style="margin-top:0">I can…</h3><ul class="frames">${L.cando.map(c => `<li><label><input type="checkbox">${T(c)}</label></li>`).join('')}</ul></div>
  <div class="card"><h3 style="margin-top:0">Words</h3><table class="vtab">${L.vocab.map(v => `<tr><td class="say" data-say="${esc(v.zh)}">${esc(v.zh)}</td><td><span class="jp">${esc(v.jp)}</span></td><td>${esc(mwText(v))}</td><td><span class="en">${esc(v.en)}</span></td></tr>`).join('')}</table></div>
  <div class="teacher"><b>Teacher Notes</b><ul><li>叫學生讀晒 My Sentences，再用其中一句講返佢最鍾意嘅動物。</li><li>功課：影一張自己屋企或者公園嘅相，講 3 句（呢度有…／有幾多…／…好…）。</li></ul></div>`;
}

// ---------- render ----------
function render() {
  document.getElementById('nav').innerHTML = PAGES.map((p, i) => `<button class="${i === st.page ? 'on' : ''}" data-act="page" data-i="${i}">${i + 1}. ${p[0]}</button>`).join('');
  document.getElementById('main').innerHTML = PAGES[st.page][1]() +
    `<div class="pagenav"><button class="btn" data-act="page" data-i="${st.page - 1}" ${st.page ? '' : 'disabled'}>← ${st.page ? PAGES[st.page - 1][0] : ''}</button>
     <button class="btn pri" data-act="page" data-i="${st.page + 1}" ${st.page < PAGES.length - 1 ? '' : 'disabled'}>${st.page < PAGES.length - 1 ? PAGES[st.page + 1][0] : ''} →</button></div>`;
}

document.addEventListener('click', e => {
  const tog = e.target.closest('[data-tog]');
  if (tog) {
    const k = tog.dataset.tog, cls = {jp: 'nojp', en: 'noen', tn: 'tn'}[k];
    document.body.classList.toggle(cls); const on = k === 'tn' ? document.body.classList.contains('tn') : !document.body.classList.contains(cls);
    tog.classList.toggle('on', on); tog.textContent = {jp: 'Jyutping', en: 'English', tn: 'Teacher Notes'}[k] + (on ? ' ON' : ' OFF');
    return;
  }
  const a = e.target.closest('[data-act]'), say = e.target.closest('[data-say]');
  if (say) { speak(say.dataset.say); if (say.classList.contains('spk') || !a) return; }
  if (!a) return;
  const d = a.dataset, act = d.act;
  if (act === 'page') { st.page = +d.i; render(); scrollTo(0, 0); return; }
  if (act === 'scene') { st.scene = +d.i; st.item = null; }
  else if (act === 'labels') st.labels = !st.labels;
  else if (act === 'hs') { st.item = d.id; speak(V[d.id].zh); }
  else if (act === 'flip') { const now = st.flipped[d.id] ?? st.flipAll; st.flipped[d.id] = !now; if (now) speak(d.zh); }
  else if (act === 'flipall') { st.flipAll = !st.flipAll; st.flipped = {}; }
  else if (act === 'ml') { const m = st.match[d.k]; if (m.done.includes(+d.i)) return; m.sel = +d.i; m.bad = null; }
  else if (act === 'mr') {
    const m = st.match[d.k], i = +d.i; if (m.done.includes(i)) return;
    if (m.sel === null) m.bad = null;
    else if (m.sel === i) { m.done.push(i); m.sel = null; m.bad = null; }
    else m.bad = i;
  }
  else if (act === 'mreset') delete st.match[d.k];
  else if (act === 'tile') {
    const p = L.patterns.find(x => x.id === d.p), sl = slotsOf(p), b = st.build[p.id] || (st.build[p.id] = {});
    const tile = tilesFor(d.t, p)[+d.k];
    let i = sl.findIndex((s, j) => s.type === d.t && !b[j]); if (i < 0) i = sl.findIndex(s => s.type === d.t);
    b[i] = tile; speak(tile.zh);
  }
  else if (act === 'unslot') delete st.build[d.p][+d.i];
  else if (act === 'pclear') delete st.build[d.p];
  else if (act === 'ppic') { const p = L.patterns.find(x => x.id === d.p); st.ppic[p.id] = ((st.ppic[p.id] || 0) + +d.d + p.pics.length) % p.pics.length; delete st.build[p.id]; }
  else if (act === 'psave') { const s = builtSentence(L.patterns.find(x => x.id === d.p)); if (!s) return; saved.push({zh: s.zh, jp: s.jp, en: s.en}); persist(); a.textContent = '✓'; return; }
  else if (act === 'mwpick') { const v = V[st.mwq.order[st.mwq.i]]; st.mwq.pick = d.m; if (mwOk(v, d.m)) { if (!st.mwq.tries) st.mwq.right++; speak('一' + d.m + v.zh); } else st.mwq.tries = 1; }
  else if (act === 'mwnext') { st.mwq.i++; st.mwq.pick = null; st.mwq.tries = 0; }
  else if (act === 'mwreset') st.mwq = null;
  else if (act === 'guess') { st.guess = d.id; speak(V[d.id].zh); }
  else if (act === 'guessshow') st.guessShow = !st.guessShow;
  else if (act === 'mscene') st.mscene = +d.i;
  else if (act === 'del') { saved.splice(+d.i, 1); persist(); }
  else return;
  const y = scrollY; render(); scrollTo(0, y);
});

Promise.all(IMG_DATA.map((d, i) => new Promise(res => {
  IMG[i] = toBlobUrl(d); const im = new Image();
  im.onload = () => { DIM[i] = [im.naturalWidth, im.naturalHeight]; res(); }; im.onerror = () => { DIM[i] = [16, 9]; res(); }; im.src = IMG[i];
}))).then(render);
</script>

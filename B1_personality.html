/* V3: accessible high-contrast teaching theme */
:root{color:#0e2446;background:#eaf0fb}
.top{background:#102b53;color:#fff;border-radius:20px;padding:22px;margin-bottom:18px}
.top .eyebrow,.top .sub{color:#d7e6ff}

.toolbar button.active{background:#1761da;color:#fff;border-color:#a9d3ff}
.stage{border:2px solid #bfd0ee;box-shadow:0 13px 34px #12345d20}
.chip{background:#1c56b9;color:white;font-weight:750;font-size:14px}
.sub,.hint,.muted{color:#485d7d}
button{border:2px solid #a4bae0;color:#13366c;font-weight:650}
.primary{background:#0758db;border-color:#0758db;color:#fff}

.panel{border:2px solid #c0d1ef;background:#fff}

.zh{font-size:clamp(27px,2.35vw,36px);line-height:1.35;color:#0b2248}

.en{font-size:20pt!important;line-height:1.25!important;color:#152d57!important;font-weight:550;overflow-wrap:anywhere}

.word{border:2px solid #91b8f4;background:#f5f9ff}

.matchbtn[data-match-left]{margin-right:7px;border-radius:12px;cursor:grab}
.matchbtn[data-match-left]::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;right:-12px;top:calc(50% - 10px);background:#dfedff;border:2px solid #2b64d5;z-index:1}
.matchbtn[data-match-right]{margin-left:7px;border-radius:12px;background:#fff;border:2px dashed #5277b4}
.matchbtn[data-match-right]::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;left:-12px;top:calc(50% - 10px);background:#edf4ff;border:2px dashed #5277b4}
.matchbtn[data-match-left].selected{background:#fff2b5;outline:3px solid #dfaa16}
.matchbtn[data-match-left].selected::after{background:#fff2b5}
.matchbtn.matched{background:#d8f9e4!important;border-color:#177641!important;color:#105b37}
.matchbtn.matched::before,.matchbtn.matched::after{background:#d8f9e4!important;border-color:#177641!important}
.matchbtn.wrong{background:#ffe2e2!important;border-color:#d32323!important}
.matchbtn .zh{font-size:30px}
.matchbtn .jp,.matchbtn .en{font-size:20pt!important}
.sentence-template{font-size:clamp(23px,2.3vw,33px);line-height:1.9;color:#10264e;font-weight:700}

.slot:not(.filled){color:#aabbd7;font-size:16px;font-weight:400}
.slot.filled{color:#082d67;background:#d3e8ff;border:2px solid #1b5bd1;font-weight:750;font-size:24px}
.full-sentence{background:#dff7e8;border:2px solid #a5dfb8}

/* V4 compact, connected matching puzzles */
.puzzle-game{max-width:1070px;margin:0 auto}
.puzzle-hint{font-size:14px;margin:0 0 12px}
.puzzle-progress{display:flex;align-items:center;gap:18px;margin:10px 0 12px;color:#10356d;font-size:18px}
.progress-track{height:12px;flex:1;border-radius:999px;background:#dbe4f1;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:#14aa4d;transition:width .2s}
.puzzle-headings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 7px;font-size:14px;font-weight:800;color:#1e3b68;text-align:center}
.puzzle-headings span{background:#e6edf9;border-radius:8px;padding:5px}
.puzzle-board{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:0 12px 0 3px}
.puzzle-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.puzzle-half{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;min-width:0;min-height:58px;padding:7px 16px;border:2px solid #4b93d7;background:#e4f1ff;border-radius:10px;cursor:pointer;color:#0c2655;line-height:1.2;text-align:left;font-family:inherit}
.puzzle-left{padding-left:14px;cursor:grab}
.puzzle-left::after{content:"";position:absolute;right:-11px;top:calc(50% - 10px);width:20px;height:20px;border:2px solid #4b93d7;border-radius:50%;background:#e4f1ff;z-index:2}
.puzzle-right{background:#f1f5fb;border-color:#879bb9;padding-left:27px;justify-content:center;text-align:center}
.puzzle-right::before{content:"";position:absolute;left:-11px;top:calc(50% - 10px);width:20px;height:20px;border:2px solid #879bb9;border-radius:50%;background:#f1f5fb;z-index:2}
.puzzle-half:hover:not(.locked){filter:brightness(.975)}
.puzzle-left.selected{background:#fff3b4;border-color:#ad7b04;outline:2px solid #e5b126}
.puzzle-left.selected::after{background:#fff3b4;border-color:#ad7b04}
.piece-zh{font-size:22px;font-weight:750;white-space:nowrap}
.piece-jp{font-size:15px;font-weight:520;color:#304f7a;overflow-wrap:anywhere}
.piece-en{font-size:17px;font-weight:670;overflow-wrap:anywhere}
.puzzle-completed{display:flex;flex-direction:column;gap:7px;margin:0 12px 14px 3px}
.puzzle-pair{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative}
.puzzle-pair .puzzle-left{border-radius:10px 0 0 10px;border-color:#16a34a;background:#def8e5;cursor:pointer}
.puzzle-pair .puzzle-right{border-radius:0 10px 10px 0;border-color:#16a34a;background:#def8e5;border-left:0;padding-left:28px;cursor:default}
.puzzle-pair .puzzle-left::after{border-color:#16a34a;background:#def8e5;z-index:4}
.puzzle-pair .puzzle-right::before{border-color:#16a34a;background:#def8e5;z-index:3}
.puzzle-pair .piece-en{color:#145b2f}
.puzzle-check{font-weight:900;font-size:18px;color:#15803d;margin-left:auto}
.puzzle-actions{justify-content:flex-start;margin-top:12px}

</style></head><body><div class="app"><header class="top"><div><div class="eyebrow">Cantonese Heritage Speakers · A2–B1</div><h1>What Kind of Person Am I?</h1><div class="sub">Personality · Strengths · Weaknesses</div></div><div class="toolbar"><button id="jpToggle" class="toggle active" aria-pressed="true">Show Jyutping: ON</button><button id="enToggle" class="toggle active" aria-pressed="true">Show English: ON</button><button id="flipAll" class="flip-all" type="button" hidden>↻ Flip All to English</button></div></header><main class="stage"><div class="heading"><span class="chip" id="lessonLabel"></span><h2 id="slideTitle"></h2><div class="sub" id="slideSubtitle"></div></div><section id="content"></section></main><nav class="nav chapter-nav" aria-label="Lesson progress and chapter navigation"><button id="prev" aria-label="Previous slide">←</button><div class="nav-progress"><div class="progress" id="progress"></div><div class="nav-progress-track"><div id="navProgressFill"></div></div></div><div class="chapter-tabs" id="chapterTabs"></div><button id="next" class="primary" aria-label="Next slide">→</button></nav><div class="footer">🔊 Click any Chinese word or sentence to hear Cantonese. Cantonese speech requires a zh-HK voice installed on your device. No external API is used.</div></div><script>

const slides=[
 {l:1,t:'Vocabulary Matching · Part 1',sub:'Match each Cantonese word with its English meaning.',type:'matching',items:vocab1.slice(0,8)},
 {l:1,t:'Vocabulary Matching · Part 2',sub:'Match the words, then discuss which ones describe you.',type:'matching',items:vocab1.slice(8)},
 {l:1,t:'Explore Personality Words',sub:'Tap any tile to hear its Cantonese pronunciation.',type:'vocab',items:vocab1},
 {l:1,t:'Talk About Yourself',sub:'Build a sentence by dragging or tapping personality tiles.',type:'builder',build:'self'},
 {l:1,t:'Same Person, Different Situations',sub:'Complete both blanks to describe how you act around different people.',type:'builder',build:'situations'},
 {l:1,t:'My Personality in 45 Seconds',sub:'Speaking challenge · Use your own personality words.',type:'final',which:1},

 {l:2,t:'Vocabulary Matching · Part 2',sub:'Match behavior and improvement vocabulary with English.',type:'matching',items:vocab2.slice(5)},
 {l:2,t:'Explore Strengths & Weaknesses',sub:'Tap a tile to hear the Cantonese pronunciation.',type:'vocab',items:vocab2},
 {l:2,t:'Talk About Your Strengths',sub:'Choose a word tile to complete each sentence.',type:'builder',build:'strengths'},
 {l:2,t:'Talk About Your Weaknesses',sub:'Describe your weaknesses and what you want to improve.',type:'builder',build:'weaknesses'},
 {l:2,t:'Explain & Give Reasons',sub:'Combine a reason and a result in one Cantonese sentence.',type:'builder',build:'reasons'},
 {l:2,t:'Strength or Weakness?',sub:'Choose a category and explain your opinion.',type:'classify'},
 {l:2,t:'Personality Interview',sub:'Answer each question with a reason and a real-life example.',type:'interview'},

];
let index=0,showJP=true,showEN=true,matchState={},builderState={},categoryState={},qIndex=0,speechTime=0,timerRef=null,selectedTile=null,cardFlips={},flipAllEnglish=false;
const SAVED_KEY='cantonese-personality-v3-saved';
let savedSentences={};
try{const raw=JSON.parse(localStorage.getItem(SAVED_KEY)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))savedSentences=raw;}catch(e){}
function persistSaved(){try{localStorage.setItem(SAVED_KEY,JSON.stringify(savedSentences))}catch(e){}}
function addSaved(){const {st,t}=getBuilder();if(!t.banks.every((_,i)=>!!st.values[i]))return;const v=getFull(t,st.values);const k=String(index);if(!Array.isArray(savedSentences[k]))savedSentences[k]=[];if(!savedSentences[k].some(x=>x[0]===v[0]))savedSentences[k].push(v);persistSaved();render()}
function removeSaved(i){const k=String(index);if(!Array.isArray(savedSentences[k]))return;savedSentences[k].splice(i,1);persistSaved();render()}
function savedPanel(){const items=Array.isArray(savedSentences[String(index)])?savedSentences[String(index)]:[];return `<section class="saved-panel"><h3>▣ My Sentences (${items.length})</h3><div class="hint">Click a saved sentence or its speaker icon to hear Cantonese. Saved on this browser.</div><div class="saved-list">${items.length?items.map((v,i)=>`<div class="saved-line"><button class="saved-play" data-saved-play="${i}" title="Play saved sentence"><div class="saved-number">${i+1} · 🔊 Play</div>${spans(v)}</button><button class="saved-remove" data-saved-remove="${i}" aria-label="Delete saved sentence ${i+1}" title="Delete">✕ Delete</button></div>`).join(''):'<div class="hint">No sentences saved yet. Build a sentence and press Add to My Sentences.</div>'}</div></section>`}

const $=x=>document.getElementById(x),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seededShuffle(items,seed){let a=[...items];let s=(seed+1)*2654435761>>>0;for(let i=a.length-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;let j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
function synthSpeak(text){if(!('speechSynthesis'in window)){alert('Speech synthesis is not supported by this browser.');return;}const syn=window.speechSynthesis;const voices=syn.getVoices();const v=voices.find(v=>v.lang.toLowerCase().replace('_','-')==='zh-hk');if(!v){alert('No Cantonese (zh-HK) voice is available. Install a Cantonese voice on your device and reopen this page.');return;}syn.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang='zh-HK';u.rate=.85;syn.speak(u)}
function spans(v,cls=''){return `<div class="zh ${cls}">${escapeHTML(v[0])}</div>${showJP?`<div class="jp">${escapeHTML(v[1])}</div>`:''}${showEN?`<div class="en">${escapeHTML(v[2])}</div>`:''}`}
function speakable(v,css='word'){return `<div class="${css} speak" role="button" tabindex="0" data-speak="${escapeHTML(v[0])}" aria-label="Play Cantonese pronunciation: ${escapeHTML(v[0])}">${spans(v)}<span class="sound">🔊 Listen</span></div>`}
function matching(s){
 const k='m'+index;
 const st=matchState[k]||(matchState[k]={selected:null,paired:[],tries:0,seed:0});
 const left=s.items.map((v,id)=>({v,id}));
 const right=seededShuffle(left,st.seed);
 const completed=left.filter(o=>st.paired.includes(o.id));
 const pendingLeft=left.filter(o=>!st.paired.includes(o.id));
 const pendingRight=right.filter(o=>!st.paired.includes(o.id));
 const complete=completed.length===left.length;
 const puzzleLeft=(o,locked=false)=>`<button type="button" class="puzzle-half puzzle-left ${locked?'locked':''} ${st.selected===o.id?'selected':''}" data-match-left="${o.id}" draggable="${!locked}" aria-label="${escapeHTML(o.v[0])}${locked?' matched':' select to match'}"><span class="piece-zh">${escapeHTML(o.v[0])}</span>${showJP?`<span class="piece-jp">${escapeHTML(o.v[1])}</span>`:''}</button>`;
 const puzzleRight=(o,locked=false)=>`<button type="button" class="puzzle-half puzzle-right ${locked?'locked':''}" data-match-right="${o.id}" ${locked?'disabled':''} aria-label="${escapeHTML(o.v[2])}"><span class="piece-en">${escapeHTML(o.v[2])}</span>${locked?'<span class="puzzle-check">✓</span>':''}</button>`;
 return `<div class="puzzle-game"><p class="hint puzzle-hint">Drag a Cantonese piece to its English meaning, or select two pieces to match. Correct pieces click together.</p><div class="puzzle-progress"><strong>${completed.length} / ${left.length} matched</strong><div class="progress-track"><div class="progress-fill" style="width:${100*completed.length/left.length}%"></div></div></div>
 ${completed.length?`<div class="puzzle-completed" aria-label="Completed matches">${completed.map(o=>`<div class="puzzle-pair">${puzzleLeft(o,true)}${puzzleRight(o,true)}</div>`).join('')}</div>`:''}
 ${!complete?`<div class="puzzle-headings"><span>Cantonese</span><span>English</span></div><div class="puzzle-board"><div class="puzzle-col">${pendingLeft.map(o=>puzzleLeft(o)).join('')}</div><div class="puzzle-col">${pendingRight.map(o=>puzzleRight(o)).join('')}</div></div>`:''}
 <div class="status ${complete?'success':''}" aria-live="polite">${complete?'✓ Excellent! Every piece is connected.':(st.message?escapeHTML(st.message):'Find the matching pieces.')}</div>
 <div class="actions puzzle-actions"><button data-action="shuffleMatch">↻ Shuffle & Retry</button><button data-action="hearWord" ${st.selected==null?'disabled':''}>🔊 Hear Selected Word</button></div></div>`;
}
function doMatch(rightId){const st=matchState['m'+index];if(!st)return;if(st.selected===null){st.message='Choose a Cantonese piece first.'}else if(st.paired.includes(rightId)){return}else if(st.selected===rightId){st.paired.push(st.selected);st.selected=null;st.message='Correct! The pieces are connected.'}else{st.tries++;st.message='Not quite. Try another match.'}render()}

const builderConfigs={
 self:{title:'Complete the sentence',templates:[{before:'我係一個比較',after:'嘅人。',prefix:'ngo5 hai6 jat1 go3 bei2 gaau3',suffix:'ge3 jan4',en:'I am a relatively ... person.',banks:[traits1]},{before:'我比較',middle:'，但係我都幾',after:'。',prefix:'ngo5 bei2 gaau3',midjp:'daan6 hai6 ngo5 dou1 gei2',suffix:'',en:'I am quite ..., but also fairly ... .',banks:[traits1,traits1]},{before:'我覺得自己',middle:'，但係朋友覺得我',after:'。',prefix:'ngo5 gok3 dak1 zi6 gei2',midjp:'daan6 hai6 pang4 jau5 gok3 dak1 ngo5',suffix:'',en:'I think I am ..., but friends think I am ... .',banks:[traits1,traits1]}]},
 situations:{title:'Complete the sentence',templates:[{before:'喺',middle:'面前，我會比較',after:'。',prefix:'hai2',midjp:'min6 cin4, ngo5 wui5 bei2 gaau3',suffix:'',en:'Around ..., I am usually more ... .',banks:[situationWords,traits1]}]},
 strengths:{title:'Build a strengths sentence',templates:[{before:'我最大嘅優點係',after:'。',prefix:'ngo5 zeoi3 daai6 ge3 jau1 dim2 hai6',suffix:'',en:'My biggest strength is ... .',banks:[positive]},{before:'我另一個優點係',after:'。',prefix:'ngo5 ling6 jat1 go3 jau1 dim2 hai6',suffix:'',en:'Another strength is ... .',banks:[positive]}]},
 weaknesses:{title:'Build a weaknesses sentence',templates:[{before:'我覺得自己最大嘅缺點係',after:'。',prefix:'ngo5 gok3 dak1 zi6 gei2 zeoi3 daai6 ge3 kyut3 dim2 hai6',suffix:'',en:'My biggest weakness is ... .',banks:[negative]},{before:'我想改善自己',after:'嘅習慣。',prefix:'ngo5 soeng2 goi2 sin6 zi6 gei2',suffix:'ge3 zaap6 gwaan3',en:'I want to improve my habit of ... .',banks:[helper2]}]},
 reasons:{title:'Explain your personality',templates:[{before:'因為我',middle:'，所以我',after:'。',prefix:'jan1 wai6 ngo5',midjp:'so2 ji5 ngo5',suffix:'',en:'Because I am ..., I ... .',banks:[reasons,outcomes]}]}
};
function getBuilder(){const build=slides[index].build;const st=builderState[index]||(builderState[index]={template:0,values:{}});const cfg=builderConfigs[build];return {st,cfg,t:cfg.templates[st.template]}}
function getFull(t,values){const a=values[0],b=values[1];const zh=t.before+(a?a[0]:'＿＿')+(t.middle||'')+(t.middle?(b?b[0]:'＿＿'):'')+t.after;const jp=[t.prefix,a?.[1]||'...',t.midjp,b?.[1],t.suffix].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();let en=t.en;for(const v of [a,b]){if(v)en=en.replace('...',v[2].charAt(0).toLowerCase()+v[2].slice(1))}return [zh,jp,en]}
function builder(s){const {st,cfg,t}=getBuilder();const v0=st.values[0],v1=st.values[1];const full=getFull(t,st.values),complete=t.banks.every((b,i)=>!!st.values[i]);const slot=(i,val)=>`<button class="slot ${val?'filled':''}" data-slot="${i}" aria-label="Fill blank ${i+1}">${val?escapeHTML(val[0]):'Drop or select a word'}</button>`;const sentence=`${escapeHTML(t.before)} ${slot(0,v0)} ${t.middle?`${escapeHTML(t.middle)} ${slot(1,v1)}`:''} ${escapeHTML(t.after)}`;
const groups=t.banks.map((group,i)=>`<div><h3>${t.banks.length===1?'Personality Word Bank':(s.build==='situations'?(i===0?'Situation Tiles':'Personality Tiles'):(s.build==='reasons'?(i===0?'Reasons':'Results'):'Word Bank · Blank '+(i+1)))}</h3><div class="bank">${group.map((w,j)=>`<div class="tile ${selectedTile?.blank===i&&selectedTile?.idx===j?'selected':''}" draggable="true" role="button" tabindex="0" data-tile="${j}" data-group="${i}" aria-label="Select ${escapeHTML(w[0])}">${spans(w)}</div>`).join('')}</div></div>`).join('');return `<div class="twocol"><section class="panel soft"><h3>${escapeHTML(cfg.title)}</h3><div class="hint">Drag a word into a blank, or tap a word tile to fill the sentence. Tap a filled blank to clear it.</div>${cfg.templates.length>1?`<div class="scene-choices" style="margin-top:12px">${cfg.templates.map((q,i)=>`<button class="${i===st.template?'active':''}" data-template="${i}">Pattern ${i+1}</button>`).join('')}</div>`:''}<div class="sentence-template">${sentence}</div>${showJP?`<p class="jp">${escapeHTML(full[1])}</p>`:''}${showEN?`<p class="en">${escapeHTML(t.en)}</p>`:''}<div class="full-sentence"><div class="tiny muted">Your sentence</div>${spans(full)}<div class="actions"><button class="primary" data-action="speakBuilt" ${!complete?'disabled':''}>🔊 Speak Sentence</button><button data-action="saveBuilt" ${!complete?'disabled':''}>＋ Add to My Sentences</button><button data-action="clearBuilt">Clear</button></div></div>${savedPanel()}</section><section class="panel word-bank-panel"><div class="bar"><h3>Word Choices</h3><span class="tiny muted">Drag or click</span></div><div class="bank-groups ${t.banks.length>1?'multiple':''}">${groups}</div></section></div>`}

function vocab(s){return `<p class="hint">Tap a card to flip it and hear Cantonese. Use “Flip All” to choose which side to study.</p><div class="grid flashcard-grid">${s.items.map((v,i)=>{const english=cardFlips[index+'-'+i]??flipAllEnglish;return `<button type="button" class="flipcard ${english?'is-english':''}" data-flip-card="${i}" aria-label="Flip and speak ${escapeHTML(v[0])}"><span class="flipcard-inner">${english?`<span class="flipcard-en">${escapeHTML(v[2])}</span>`:`<span class="flipcard-zh">${escapeHTML(v[0])}</span>${showJP?`<span class="flipcard-jp">${escapeHTML(v[1])}</span>`:''}`}</span><span class="flipcorner">↻</span></button>`}).join('')}</div>`}
function pattern(v){return `<div class="pattern speak" data-speak="${escapeHTML(v[0])}" role="button" tabindex="0">${spans(v)}<div class="sound">🔊 Tap to listen</div></div>`}
function finalTask(which){const one=which===1;const desc=one?['用大約四十五秒介紹自己嘅性格。講出至少三個性格特點，並解釋自己喺唔同場合有咩唔同。','jung6 daai6 joek3 sei3 sap6 ng5 miu5 gaai3 siu6 zi6 gei2 ge3 sing3 gaak3. gong2 ceot1 zi3 siu2 saam1 go3 sing3 gaak3 dak6 dim2, bing6 gaai2 sik1 zi6 gei2 hai2 m4 tung4 coeng4 hap6 jau5 me1 m4 tung4.','Introduce your personality in about 45 seconds. Describe at least three traits and how you behave in different situations.']:['用大約一分鐘講出你兩個優點、一個缺點，同埋一個真實例子。最後講一樣你想改善嘅事。','jung6 daai6 joek3 jat1 fan1 zung1 gong2 ceot1 nei5 loeng5 go3 jau1 dim2, jat1 go3 kyut3 dim2, tung4 maai4 jat1 go3 zan1 sat6 lai6 zi2. zeoi3 hau6 gong2 jat1 joeng6 nei5 soeng2 goi2 sin6 ge3 si6.','Talk for about one minute. Describe two strengths, one weakness, and a real-life example. Finish with something you would like to improve.'];const words=one?vocab1:positive.concat(negative.filter(v=>!positive.some(p=>p[0]===v[0])));const pats=one?patterns1:patterns2;return `<div class="task speak" role="button" tabindex="0" data-speak="${escapeHTML(desc[0])}"><div class="zh">${escapeHTML(desc[0])}</div>${showJP?`<div class="jp">${escapeHTML(desc[1])}</div>`:''}${showEN?`<div class="en">${escapeHTML(desc[2])}</div>`:''}<div class="sound">🔊 Listen to task instructions</div></div><div class="twocol"><section class="panel"><h3>Useful Sentence Patterns</h3><div class="patterns">${pats.map(pattern).join('')}</div><div class="helper"><strong>Speaking Practice</strong><div class="bar"><span class="timer" id="timerDisplay">${formatTimer(speechTime|| (one?45:60))}</span><div class="actions"><button data-action="startTimer">Start</button><button data-action="resetTimer">Reset</button></div></div><div class="hint">Speak naturally. The timer does not record audio.</div></div></section><section class="panel"><h3>Personality Word Bank</h3><div class="bank">${words.map(v=>`<div class="tile speak" role="button" tabindex="0" data-speak="${escapeHTML(v[0])}">${spans(v)}</div>`).join('')}</div></section></div>`}
function classify(){const items=[['細心','sai3 sam1','Detail-oriented'],['固執','gu3 zap1','Stubborn'],['直接','zik6 zip3','Direct'],['慢熱','maan6 jit6','Slow to warm up']];return `<p class="hint">Is each trait a strength, a weakness, or both? There is no single correct answer. Explain your opinion in Cantonese.</p>${items.map((v,i)=>`<div class="panel" style="margin-bottom:10px"><div class="bar"><div class="speak" role="button" tabindex="0" data-speak="${escapeHTML(v[0])}">${spans(v)}<div class="sound">🔊</div></div><div class="scene-choices">${['優點','缺點','兩個都得'].map((w,j)=>`<button class="${categoryState[i]===j?'active':''}" data-category="${i}" data-value="${j}">${w}${showJP?`<span class="tiny" style="display:block">${['jau1 dim2','kyut3 dim2','loeng5 go3 dou1 dak1'][j]}</span>`:''}</button>`).join('')}</div></div>${categoryState[i]!==undefined?'<p class="hint">Why? Can you give an example?</p>':''}</div>`).join('')}<button data-action="clearCategory">Try Again</button>`}
function interview(){const v=questions[qIndex];return `<div class="question speak" role="button" tabindex="0" data-speak="${escapeHTML(v[0])}">${spans(v)}<div class="sound">🔊 Hear question</div></div><div class="actions" style="justify-content:center"><button class="primary" data-action="nextQuestion">Next Question ↻</button></div><div class="helper"><strong>Useful patterns</strong><div class="patterns" style="margin-top:10px">${[['因為……','jan1 wai6 ...','Because ...'],['例如……','lai6 jyu4 ...','For example ...'],['雖然……但係……','seoi1 jin4 ... daan6 hai6 ...','Although ... , ...']].map(pattern).join('')}</div></div>`}
function formatTimer(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function stopTimer(){if(timerRef){clearInterval(timerRef);timerRef=null}}
function chaptersForLesson(lesson){return lesson===1?[{label:'Vocabulary',start:0,end:2},{label:'Talk About Yourself',start:3,end:3},{label:'Different Situations',start:4,end:4},{label:'45-Second Talk',start:5,end:5}]:[{label:'Vocabulary',start:6,end:8},{label:'Strengths',start:9,end:9},{label:'Weaknesses',start:10,end:10},{label:'Reasons & Opinions',start:11,end:12},{label:'Interview',start:13,end:13},{label:'Final Talk',start:14,end:14}]}
function renderChapterNav(){const lesson=slides[index].l;const starts=lesson===1?0:6;const end=lesson===1?5:14;const count=end-starts+1;const within=index-starts+1;$('progress').textContent=`Lesson ${lesson} · ${within} / ${count}`;$('navProgressFill').style.width=`${within/count*100}%`;$('chapterTabs').innerHTML=chaptersForLesson(lesson).map((c,i)=>`<button type="button" class="chapter-tab ${index>=c.start&&index<=c.end?'current':''}" data-jump="${c.start}" title="Go to ${escapeHTML(c.label)}"><span class="chapter-number">${i+1}</span><span>${escapeHTML(c.label)}</span></button>`).join('')}
function render(){const s=slides[index];$('lessonLabel').textContent=`LESSON ${s.l} · ${s.l===1?'DESCRIBING PERSONALITY':'STRENGTHS & WEAKNESSES'}`;$('slideTitle').textContent=s.t;$('slideSubtitle').textContent=s.sub;let html=s.type==='matching'?matching(s):s.type==='vocab'?vocab(s):s.type==='builder'?builder(s):s.type==='final'?finalTask(s.which):s.type==='classify'?classify():interview();$('content').innerHTML=html;renderChapterNav();$('flipAll').hidden=s.type!=='vocab';$('flipAll').textContent=flipAllEnglish?'↻ Flip All to Cantonese':'↻ Flip All to English';$('prev').disabled=index===0;$('next').textContent=index===slides.length-1?'↻':'→';for(const [id,name,val] of [['jpToggle','Jyutping',showJP],['enToggle','English',showEN]]){$(id).textContent=`Show ${name}: ${val?'ON':'OFF'}`;$(id).classList.toggle('active',val);$(id).setAttribute('aria-pressed',String(val))}}
function selectTile(el){const {st,t}=getBuilder();const group=Number(el.dataset.group),i=Number(el.dataset.tile),word=t.banks[group]?.[i];if(!word)return;st.values[group]=word;selectedTile={blank:group,idx:i};synthSpeak(word[0]);render()}
function dropTile(e){const el=e.target.closest('[data-slot]');if(!el)return;e.preventDefault();const {st,t}=getBuilder();const idx=Number(el.dataset.slot);const raw=e.dataTransfer?.getData('text/plain');if(!raw)return;let data;try{data=JSON.parse(raw)}catch{return}if(data.slide!==index)return;const group=Number(data.group);const word=t.banks[group]?.[Number(data.idx)];if(!word||group!==idx)return;st.values[idx]=word;selectedTile=null;render()}
document.addEventListener('dragstart',e=>{const m=e.target.closest('[data-match-left]');if(m){e.dataTransfer.setData('application/x-cantonese-match',String(m.dataset.matchLeft));e.dataTransfer.setData('text/plain',String(m.dataset.matchLeft));e.dataTransfer.effectAllowed='move';return}const el=e.target.closest('[data-tile]');if(!el)return;e.dataTransfer.setData('text/plain',JSON.stringify({slide:index,group:el.dataset.group,idx:el.dataset.tile}));e.dataTransfer.effectAllowed='copy'});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-slot],[data-match-right]'))e.preventDefault()});document.addEventListener('drop',e=>{const m=e.target.closest('[data-match-right]');if(m){e.preventDefault();const raw=e.dataTransfer.getData('application/x-cantonese-match');if(raw==='')return;const st=matchState['m'+index];if(st&&slides[index].type==='matching'){st.selected=Number(raw);doMatch(Number(m.dataset.matchRight))}return}dropTile(e)});
document.addEventListener('click',e=>{const jump=e.target.closest('[data-jump]');if(jump){stopTimer();index=Number(jump.dataset.jump);selectedTile=null;speechTime=0;render();return}const card=e.target.closest('[data-flip-card]');if(card){const i=Number(card.dataset.flipCard);const k=index+'-'+i;cardFlips[k]=!(cardFlips[k]??flipAllEnglish);synthSpeak(slides[index].items[i][0]);render();return}const savedPlay=e.target.closest('[data-saved-play]');if(savedPlay){const v=savedSentences[String(index)]?.[Number(savedPlay.dataset.savedPlay)];if(v)synthSpeak(v[0]);return}const savedRemove=e.target.closest('[data-saved-remove]');if(savedRemove){removeSaved(Number(savedRemove.dataset.savedRemove));return}const left=e.target.closest('[data-match-left]');if(left){const st=matchState['m'+index];const id=Number(left.dataset.matchLeft);if(st.paired.includes(id)){synthSpeak(slides[index].items[id][0]);return;}st.selected=id;st.message='';synthSpeak(slides[index].items[id][0]);render();return}const right=e.target.closest('[data-match-right]');if(right){doMatch(Number(right.dataset.matchRight));return}const tile=e.target.closest('[data-tile]');if(tile){selectTile(tile);return}const slot=e.target.closest('[data-slot]');if(slot){const st=builderState[index],i=Number(slot.dataset.slot);if(st.values[i]){delete st.values[i];render()}else if(selectedTile){const {t}=getBuilder();const w=t.banks[selectedTile.blank]?.[selectedTile.idx];if(w&&selectedTile.blank===i){st.values[i]=w;selectedTile=null;render()}}return}const template=e.target.closest('[data-template]');if(template){const st=builderState[index];st.template=Number(template.dataset.template);st.values={};selectedTile=null;render();return}const cat=e.target.closest('[data-category]');if(cat){categoryState[Number(cat.dataset.category)]=Number(cat.dataset.value);render();return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='shuffleMatch'){let st=matchState['m'+index];matchState['m'+index]={selected:null,paired:[],tries:0,seed:st.seed+1}}else if(a==='hearWord'){const st=matchState['m'+index];if(st.selected!==null)synthSpeak(slides[index].items[st.selected][0]);return}else if(a==='saveBuilt'){addSaved();return}else if(a==='clearBuilt'){builderState[index].values={};selectedTile=null}else if(a==='speakBuilt'){const {st,t}=getBuilder();if(t.banks.every((b,i)=>!!st.values[i]))synthSpeak(getFull(t,st.values)[0]);return}else if(a==='clearCategory'){categoryState={}}else if(a==='nextQuestion'){qIndex=(qIndex+1)%questions.length}else if(a==='startTimer'){stopTimer();if(speechTime<=0)speechTime=slides[index].which===1?45:60;timerRef=setInterval(()=>{speechTime=Math.max(0,speechTime-1);const display=$('timerDisplay');if(display)display.textContent=formatTimer(speechTime);if(!speechTime)stopTimer()},1000);return}else if(a==='resetTimer'){stopTimer();speechTime=slides[index].which===1?45:60}render();return}const sp=e.target.closest('[data-speak]');if(sp){synthSpeak(sp.dataset.speak)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-speak],[data-tile]')){e.preventDefault();e.target.click()}});
$('prev').onclick=()=>{stopTimer();selectedTile=null;speechTime=0;index=Math.max(0,index-1);render()};$('next').onclick=()=>{stopTimer();selectedTile=null;speechTime=0;index=(index+1)%slides.length;render()};$('flipAll').onclick=()=>{flipAllEnglish=!flipAllEnglish;for(const k of Object.keys(cardFlips))if(k.startsWith(index+'-'))delete cardFlips[k];render()};$('jpToggle').onclick=()=>{showJP=!showJP;render()};$('enToggle').onclick=()=>{showEN=!showEN;render()};if('speechSynthesis' in window)window.speechSynthesis.getVoices();render();
</script></body></html>
